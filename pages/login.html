<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In - PureNest Housekeeping</title>

  <meta name="description"
    content="Sign in to your PureNest customer portal to manage bookings, track cleaner arrivals, and download invoices.">

  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#2E8B72',
              dark: '#1E6B56',
              light: '#E8F5F0'
            },
            secondary: {
              DEFAULT: '#F2B866',
              dark: '#D99B48',
              light: '#FEF7EE'
            },
            surface: {
              DEFAULT: '#FFFFFF',
              alt: '#F1F4F1',
              dark: '#172220'
            },
            background: {
              DEFAULT: '#F7F8F5',
              dark: '#101817'
            }
          },

          fontFamily: {
            heading: ['Manrope', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
</head>


<body
  class="bg-background text-[#18211F] dark:text-[#F4F7F5] dark:bg-[#101817] antialiased flex flex-col min-h-screen justify-center items-center p-4 relative">


  <!-- =========================================================
       FLOATING THEME / RTL TOGGLES
       ========================================================= -->

  <div class="fixed top-4 right-4 flex items-center gap-2 z-50">

    <button
      class="rtl-toggle-btn p-2 rounded-lg border border-border hover:border-primary text-text-muted text-xs font-bold bg-surface dark:bg-[#172220] transition-colors"
      title="Toggle RTL" aria-label="Toggle RTL">

      <span class="rtl-label">RTL</span>

    </button>


    <button
      class="theme-toggle-btn p-2 rounded-lg border border-border hover:border-primary text-text-muted bg-surface dark:bg-[#172220] transition-colors"
      title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode">

      <i data-lucide="sun" class="icon-sun w-5 h-5" style="display:none;">
      </i>

      <i data-lucide="moon" class="icon-moon w-5 h-5">
      </i>

    </button>

  </div>


  <!-- =========================================================
       LOGIN CONTAINER
       ========================================================= -->

  <div class="w-full max-w-md">

    <div class="card-clean p-7 sm:p-8 shadow-xl border border-border">


      <!-- =====================================================
           BRAND + LOGIN INTRO
           ===================================================== -->

      <div class="text-center mb-8">

        <a href="../index.html" class="inline-flex items-center justify-center">

          <!-- Light Logo -->
          <img src="../assets/images/logo.png" alt="PureNest Housekeeping"
            class="site-brand-logo logo-light mx-auto h-14 w-auto">

          <!-- Dark Logo -->
          <img src="../assets/images/logo-white.png" alt="PureNest Housekeeping"
            class="site-brand-logo logo-dark mx-auto h-14 w-auto">

        </a>


        <h1 class="text-2xl sm:text-3xl font-heading font-bold mt-5">

          Welcome Back

        </h1>


        <p class="text-xs sm:text-sm text-text-muted mt-2 max-w-xs mx-auto leading-relaxed">

          Sign in to manage your appointments & tracking

        </p>

      </div>


      <!-- =====================================================
           LOGIN FORM
           ===================================================== -->

      <form data-validate="true" class="space-y-4">


        <!-- Email -->
        <div class="form-group mb-0">

          <label class="form-label text-xs">
            Email Address *
          </label>

          <input type="email" class="form-input text-sm" placeholder="sarah@example.com" value="sarah@example.com"
            required>

          <span class="form-error-msg"></span>

        </div>


        <!-- Password -->
        <div class="form-group mb-0">

          <div class="flex items-center justify-between mb-1">

            <label class="form-label text-xs mb-0">
              Password *
            </label>

            <a href="#" class="text-xs text-primary hover:underline">

              Forgot?

            </a>

          </div>


          <input type="password" class="form-input text-sm" placeholder="••••••••" value="password123" required>

          <span class="form-error-msg"></span>

        </div>


        <!-- Remember Device -->
        <div class="flex items-center justify-between text-xs py-1">

          <label class="flex items-center gap-2 cursor-pointer">

            <input type="checkbox" checked class="rounded text-primary focus:ring-primary">

            <span>
              Remember this device
            </span>

          </label>

        </div>


        <!-- Sign In -->
        <a href="../dashboard/index.html" class="btn btn-primary w-full py-3 inline-flex items-center justify-center">

          Sign In to Dashboard

        </a>

      </form>


      <!-- =====================================================
           SOCIAL LOGIN DIVIDER
           ===================================================== -->

      <div class="relative flex items-center justify-center my-6">

        <div class="border-t border-border w-full"></div>

        <span class="bg-surface dark:bg-surface-dark px-3 text-xs text-text-muted absolute">

          Or continue with

        </span>

      </div>


      <!-- =====================================================
           SOCIAL LOGIN BUTTONS
           ===================================================== -->

      <div class="grid grid-cols-2 gap-3">


        <!-- Google -->
        <a href="../dashboard/index.html"
          class="btn btn-outline text-xs py-2.5 inline-flex items-center justify-center gap-2">

          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" aria-hidden="true">

            <path fill="#4285F4"
              d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.39z" />

            <path fill="#34A853"
              d="M12 21.5c2.63 0 4.84-.87 6.45-2.34l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.5A9.74 9.74 0 0 0 12 21.5z" />

            <path fill="#FBBC05"
              d="M6.54 13.62A5.85 5.85 0 0 1 6.23 12c0-.56.1-1.1.31-1.62v-2.5H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.38l3.24-2.76z" />

            <path fill="#EA4335"
              d="M12 6.35c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.44 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.38l3.24 2.5C7.31 8.07 9.46 6.35 12 6.35z" />

          </svg>

          <span>Google</span>

        </a>


        <!-- Apple -->
        <a href="../dashboard/index.html"
          class="btn btn-outline text-xs py-2.5 inline-flex items-center justify-center gap-2">

          <svg class="w-4 h-4 shrink-0 fill-current" viewBox="0 0 24 24" aria-hidden="true">

            <path
              d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 8.13 7.31c1.12.06 1.9.61 2.55.66.98-.2 1.92-.77 2.96-.73 1.26.1 2.21.61 2.85 1.52-2.6 1.56-1.98 4.97.4 5.93-.48 1.27-1.1 2.51-1.84 3.68zM12.03 7.25C11.9 5.37 13.43 3.83 15.2 3.75c.24 2.17-1.97 3.77-3.17 3.5z" />

          </svg>

          <span>Apple ID</span>

        </a>

      </div>

    </div>


    <!-- =====================================================
         CREATE ACCOUNT
         ===================================================== -->

    <p class="text-center text-xs text-text-muted mt-6">

      Don't have an account yet?

      <a href="register.html" class="font-semibold text-primary hover:underline">

        Create Account

      </a>

    </p>

  </div>


  <!-- =========================================================
       SCRIPTS
       ========================================================= -->

  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/main.js"></script>

  <script>
    lucide.createIcons();
  </script>

</body>

</html>
