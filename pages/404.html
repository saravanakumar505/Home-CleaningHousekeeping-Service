<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - PureNest Housekeeping</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#2E8B72', dark: '#1E6B56', light: '#E8F5F0' },
            secondary: { DEFAULT: '#F2B866', dark: '#D99B48', light: '#FEF7EE' },
            surface: { DEFAULT: '#FFFFFF', alt: '#F1F4F1', dark: '#172220' },
            background: { DEFAULT: '#F7F8F5', dark: '#101817' }
          },
          fontFamily: {
            heading: ['Manrope', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
</head>
<body class="bg-background text-[#18211F] dark:text-[#F4F7F5] dark:bg-[#101817] antialiased flex flex-col min-h-screen justify-center items-center p-6 text-center relative">

  <!-- Floating Theme / RTL Toggles -->
  <div class="fixed top-4 right-4 flex items-center gap-2 z-50">
    <button class="rtl-toggle-btn p-2 rounded-lg border border-border hover:border-primary text-text-muted text-xs font-bold bg-surface dark:bg-[#172220] transition-colors" title="Toggle RTL"><span class="rtl-label">RTL</span></button>
    <button class="theme-toggle-btn p-2 rounded-lg border border-border hover:border-primary text-text-muted bg-surface dark:bg-[#172220] transition-colors" title="Toggle Dark/Light Mode">
      <i data-lucide="sun" class="icon-sun w-5 h-5" style="display:none;"></i>
      <i data-lucide="moon" class="icon-moon w-5 h-5"></i>
    </button>
  </div>

  <div class="max-w-md">
    <a href="../index.html" class="inline-block mb-6">
      <img src="../assets/images/logo.png" alt="PureNest Housekeeping" class="site-brand-logo logo-light mx-auto h-12">
      <img src="../assets/images/logo-white.png" alt="PureNest Housekeeping" class="site-brand-logo logo-dark mx-auto h-12">
    </a>
    <div class="w-16 h-16 rounded-2xl bg-primary-light text-primary flex items-center justify-center mx-auto mb-4 shadow-md animate-float">
      <i data-lucide="sparkles" class="w-8 h-8"></i>
    </div>
    <span class="text-xs font-bold text-primary uppercase tracking-widest">Error 404</span>
    <h1 class="text-3xl sm:text-4xl font-heading font-extrabold mt-2 mb-3">
      Looks Like This Page Needs a Little Cleaning.
    </h1>
    <p class="text-sm text-text-muted mb-8 leading-relaxed">
      The room or link you're searching for seems to have been swept away. Let's get you back to a tidy space!
    </p>

    <div class="flex flex-wrap items-center justify-center gap-4">
      <a href="../index.html" class="btn btn-primary"><i data-lucide="home" class="w-4 h-4"></i> Back Home</a>
      <a href="services.html" class="btn btn-outline">Explore Services</a>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
</body>
</html>
